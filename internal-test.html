<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一鍵超人｜內部測試台</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:#0b1020;color:#e5eefc}.app{max-width:920px;margin:auto;padding:16px 12px 60px}.hero,.card{border:1px solid #26344f;border-radius:22px;background:#121a2b;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#10172a,#183462 58%,#11453c)}h1{font-size:25px;margin:8px 0}p{color:#cbd5e1;line-height:1.6}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#94a3b8;font-weight:800}input,select{border:1px solid #26344f;border-radius:12px;background:#0f1728;color:#e5eefc;padding:10px}button{border:0;border-radius:14px;padding:11px 14px;font-weight:900;color:white;background:#2563eb;margin:8px 8px 0 0}.green{background:#15803d}.gray{background:#1f2937}.status{white-space:pre-wrap;border:1px dashed #334155;background:#0f1728;border-radius:14px;padding:12px;margin-top:10px;color:#cbd5e1}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pick{border:1px solid #26344f;background:#0f1728;border-radius:18px;padding:12px}.pick b{font-size:19px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.kv div{background:#0d1424;border:1px solid #1f2d46;border-radius:12px;padding:8px}.kv small{display:block;color:#94a3b8}pre{white-space:pre-wrap;overflow:auto;background:#0d1424;border:1px solid #1f2d46;border-radius:12px;padding:10px;color:#cbd5e1}@media(max-width:720px){.row,.cards,.kv{grid-template-columns:1fr}}</style></head><body><div class="app"><section class="hero"><h1>一鍵超人｜內部測試台</h1><p>先用這頁確認後台 API、公開資料、策略輸出都正常；全部通過後，再把主頁連到外部正式網址。</p></section><section class="card"><h2>測試設定</h2><div class="row"><div class="field"><label>市場範圍</label><select id="scope"><option value="all">上市+上櫃</option><option value="twse">上市</option><option value="tpex">上櫃</option></select></div><div class="field"><label>熱門依據</label><select id="heatBy"><option value="money">成交金額</option><option value="volume">成交量</option><option value="trades">交易筆數</option></select></div><div class="field"><label>顯示檔數</label><input id="maxResults" type="number" value="6" min="3" max="12"></div><div class="field"><label>熱門前幾名</label><input id="topHeat" type="number" value="30" min="10" max="100"></div></div><button class="gray" onclick="health()">🔌 測試後台</button><button class="green" onclick="selfTest()">✅ 自我檢查</button><button onclick="run()">🚀 產生清單</button><div id="status" class="status">尚未測試。</div></section><section class="card"><h2>結果</h2><div id="result"></div></section><section class="card"><h2>原始檢查資料</h2><pre id="debug">{}</pre></section></div><script>const $=s=>document.querySelector(s);const fmt=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'-';function setStatus(t){$('#status').textContent=t}async function api(path){const r=await fetch(path,{cache:'no-store'});let j=null;try{j=await r.json()}catch{}if(!r.ok||!j?.ok)throw new Error(j?.error||'HTTP '+r.status);return j}function query(){const q=new URLSearchParams();['scope','heatBy','topHeat','maxResults'].forEach(id=>q.set(id,$('#'+id).value));return q.toString()}async function health(){try{setStatus('測試 /api/health 中...');const j=await api('/api/health');$('#debug').textContent=JSON.stringify(j,null,2);setStatus('後台正常：'+j.message)}catch(e){setStatus('後台失敗：'+e.message)}}async function selfTest(){try{setStatus('執行 /api/self-test 中...');const j=await api('/api/self-test');$('#debug').textContent=JSON.stringify(j,null,2);setStatus(j.ok?'自我檢查通過':'自我檢查未通過，請看下方資料')}catch(e){setStatus('自我檢查失敗：'+e.message)}}function card(x){return `<div class="pick"><b>${x.id} ${x.name||''}</b><p>${x.market||''}｜${x.advice||''}｜分數 ${x.score}</p><div class="kv"><div><small>收盤</small>${fmt(x.close)}</div><div><small>熱度</small>${fmt(x.heat)}</div><div><small>進場區</small>${fmt(x.entryZone?.low)}～${fmt(x.entryZone?.high)}</div><div><small>停損區</small>${fmt(x.stopZone?.price)}</div></div></div>`}async function run(){try{setStatus('呼叫 /api/analyze 中...');const j=await api('/api/analyze?'+query());$('#debug').textContent=JSON.stringify({mode:j.mode,stats:j.stats,warnings:j.warnings,params:j.params},null,2);$('#result').innerHTML=j.final?.length?`<div class="cards">${j.final.map(card).join('')}</div>`:'沒有符合條件的股票。';setStatus('完成：'+(j.final?.length||0)+' 檔；模式 '+j.mode)}catch(e){setStatus('產生失敗：'+e.message)}}</script></body></html>
