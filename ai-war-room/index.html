<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:15px/1.55 system-ui,-apple-system,"Segoe UI";}main{max-width:1020px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;font-size:24px}small,.muted{color:#95a3bf}.card{background:#11182b;border:1px solid #28344e;border-radius:16px;padding:14px;margin-top:12px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label span{display:block;font-size:12px;color:#95a3bf;margin-bottom:6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0d1424;color:#eef3ff;border:1px solid #33415f;border-radius:9px;padding:9px}button{border:0;border-radius:10px;padding:10px 13px;background:#25314a;color:#eef3ff;cursor:pointer}.pri{background:#667eea;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.providers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.provider{border:1px solid #33415f;border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.provider input{width:auto}.provider.on{background:#182647;border-color:#667eea}.provider.ok{box-shadow:inset 0 0 0 1px #2c9b78}.provider .name{font-weight:700}.provider .state{margin-left:auto;font-size:12px;color:#95a3bf}.roundhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.roundtitle{font-weight:800;color:#cbd5e1}.msg{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #222e46}.msg:last-child{border:0}.bubble{white-space:pre-wrap;word-break:break-word}.final .bubble{background:#182647;border:1px solid #405782;border-radius:12px;padding:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}textarea{min-height:110px;resize:vertical}.err{background:#3a1820;color:#ffdce1;padding:10px;border-radius:10px;margin:10px 0}.warn{background:#332a12;color:#ffe7a3;padding:10px;border-radius:10px;margin:10px 0}.settings{display:grid;gap:10px}.line{display:grid;grid-template-columns:105px 1fr 1fr auto;gap:8px;align-items:end;border-top:1px solid #26324b;padding-top:10px}.line:first-child{border:0}.testmsg{grid-column:2/-1;font-size:13px;padding:7px 9px;border-radius:8px;margin-top:2px}.testmsg.good{background:#102c25;color:#9cf0d0}.testmsg.bad{background:#3a1820;color:#ffdce1}.testsummary{padding:10px 12px;border-radius:10px;background:#101a31;margin:8px 0}.testsummary.bad{background:#3a1820;color:#ffdce1}.hide{display:none}.hint{font-size:13px;color:#aab4c8;margin-top:8px}.count{font-weight:700}.progress{padding:10px 12px;border-radius:10px;background:#101a31;color:#b8c4dc;margin-top:10px}.sep{height:1px;background:#26324b;margin:10px 0}
@media(max-width:760px){.controls,.providers,.line,.msg{grid-template-columns:1fr}.provider{min-height:46px}}
</style></head><body><main>
<header><div><h1>AI 戰情室</h1><small>Gemini · Mistral · Groq · v11</small></div><button id="toggle">⚙ API 設定</button></header>

<section class="card">
  <div class="controls">
    <label><span>發言模式</span><select id="pace"><option value="fast" selected>⚡ 高速並行</option><option value="debate">逐一辯論</option></select></label>
    <label><span>對話輪數</span><select id="rounds"><option value="1">1 輪</option><option value="2" selected>2 輪</option><option value="3">3 輪</option><option value="4">4 輪</option><option value="5">5 輪</option></select></label>
    <label><span>Final 整理 AI</span><select id="final"></select></label>
  </div>
  <div class="hint"><b>v11：</b>目前使用 Gemini / Mistral / Groq。Mistral 採更保守的免費額度節流與較短輸出；Gemini 使用較寬鬆的專屬 timeout。三家仍獨立運作，單一 API 限流或逾時不會中止整場。</div>
</section>

<section class="card">
  <div class="roundhead"><strong>參與本次對話</strong><span class="count" id="count"></span></div>
  <div class="providers" id="providers"></div>
</section>

<section class="card hide" id="settings"><div class="settings">
  <div class="muted">只需要填你要使用的 AI。現在「測試」只驗證 API Key 是否有效，不會因指定模型不可用而誤判。每個 AI 的結果會直接顯示在自己的欄位下面。</div>
  <div id="testSummary" class="testsummary hide"></div>
  <div id="rows"></div>
  <label><input id="remember" type="checkbox" style="width:auto"> 記住 API Key 在這台瀏覽器</label>

</div></section>

<section class="card" id="chat">
  <p id="empty" class="muted">選擇至少 2 個 AI、設定輪數，輸入問題後開始。每一輪所有參與者都會看到前面的討論再繼續發言。</p>
  <div id="progress" class="progress hide"></div>
  <div id="msgs"></div>
</section>

<section class="card">
  <textarea id="q" placeholder="輸入問題…"></textarea>
  <div class="actions"><button id="clear">清除</button><button id="go" class="pri">開始多人討論 ↗</button></div>
</section>
</main>

<script>
const API='https://uimcaonikxuthcapgjqo.supabase.co/functions/v1/multi-ai-collab';
const P=[
 {id:'gemini',name:'Gemini',model:'gemini-3.8-flash',key:'',ok:false,on:true,testMsg:''},
 {id:'mistral',name:'Mistral',model:'mistral-medium-latest',key:'',ok:false,on:true,testMsg:''},
 {id:'groq',name:'Groq',model:'openai/gpt-oss-120b',key:'',ok:false,on:true,testMsg:''}
];
const $=id=>document.getElementById(id), state={history:[],running:false,cooldowns:{},blocked:{},governor:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cut=(s,n=18000)=>String(s||'').slice(0,n);
const find=id=>P.find(p=>p.id===id);
const selected=()=>P.filter(p=>p.on);

function gov(p){
 if(!state.governor[p.id])state.governor[p.id]={req:[],tok:[],rpm:null,tpm:null,minGap:p.id==='mistral'?3500:350,lastAt:0,failures:0,circuitUntil:0,halfOpen:false};
 return state.governor[p.id];
}
function providerStateText(p){
 const now=Date.now(),g=gov(p);
 if(state.blocked[p.id])return '⛔ '+state.blocked[p.id];
 if(g.circuitUntil>now)return '🟡 熔斷 '+Math.ceil((g.circuitUntil-now)/1000)+'s';
 const cd=Math.max(0,Number(state.cooldowns[p.id]||0)-now);
 if(cd>0)return '⏳ 冷卻 '+Math.ceil(cd/1000)+'s';
 if(p.ok)return '✓ 已連線';
 return p.key?'未測試':'未設定';
}
function renderParticipants(){
 const list=selected();
 $('providers').innerHTML=P.map(p=>'<label class="provider '+(p.on?'on ':'')+(p.ok?'ok':'')+'"><input type="checkbox" data-join="'+p.id+'" '+(p.on?'checked':'')+'><span class="name">'+p.name+'</span><span class="state">'+esc(providerStateText(p))+'</span></label>').join('');
 $('count').textContent=list.length+' / '+P.length+' 已加入';
 const old=$('final').value;
 $('final').innerHTML=list.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('');
 if(list.some(p=>p.id===old))$('final').value=old;
 document.querySelectorAll('[data-join]').forEach(e=>e.onchange=()=>{
   const p=find(e.dataset.join);
   if(!e.checked && selected().length<=2){e.checked=true;return error('至少要保留 2 個 AI 參與對話。')}
   p.on=e.checked; renderParticipants(); savePrefs(false);
 });
}
function renderSettings(){
 $('rows').innerHTML=P.map(p=>'<div class="line"><strong>'+p.name+'</strong><label><span>API Key</span><input type="password" data-key="'+p.id+'" value="'+esc(p.key)+'" placeholder="'+(p.id==='groq'?'gsk_…':p.id==='gemini'?'AIza…':'Mistral key')+'"></label><label><span>Model</span><input data-model="'+p.id+'" value="'+esc(p.model)+'"></label><button data-test="'+p.id+'">測試</button>'+(p.testMsg?'<div class="testmsg '+(p.ok?'good':'bad')+'">'+esc(p.testMsg)+'</div>':'')+'</div>').join('');
 document.querySelectorAll('[data-key]').forEach(e=>e.oninput=()=>{const p=find(e.dataset.key);p.key=e.value.trim();delete state.blocked[p.id];const g=gov(p);g.failures=0;g.circuitUntil=0;g.halfOpen=false;});
 document.querySelectorAll('[data-model]').forEach(e=>e.oninput=()=>find(e.dataset.model).model=e.value.trim());
 document.querySelectorAll('[data-test]').forEach(e=>e.onclick=()=>test(find(e.dataset.test),e));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function parseDurationMs(v){
 if(v==null)return null;
 const s=String(v).trim();
 const n=Number(s);if(Number.isFinite(n))return n*1000;
 let total=0,hit=false,m;
 const re=/([0-9.]+)\s*(ms|s|m|h)/g;
 while((m=re.exec(s))){hit=true;const x=Number(m[1]);total+=m[2]==='ms'?x:m[2]==='s'?x*1000:m[2]==='m'?x*60000:x*3600000}
 if(hit)return total;
 const when=Date.parse(s);return Number.isFinite(when)?Math.max(0,when-Date.now()):null;
}
function serverRetryMs(diag){
 if(!diag)return null;
 if(Number.isFinite(Number(diag.retry_after_seconds)))return Math.max(0,Number(diag.retry_after_seconds)*1000);
 const h=diag.rate_headers||{};
 return parseDurationMs(h['retry-after'])||parseDurationMs(h['x-ratelimit-reset-requests'])||parseDurationMs(h['x-ratelimit-reset-tokens'])||parseDurationMs(h['x-ratelimit-reset']);
}
function diagnoseRateLimit(d,status){
 const diag=d?.diagnostic||{};
 const h=diag.rate_headers||{};
 const parts=[];
 const provider=diag.provider?diag.provider.toUpperCase():'API';
 parts.push(provider+' HTTP '+(diag.http_status||status||429));
 if(diag.code)parts.push(String(diag.code));
 const msg=String(diag.message||d?.error||'Rate limit exceeded');
 const low=msg.toLowerCase();
 if(/tokens? per minute|tpm|token/.test(low))parts.push('可能是 TPM / Token 額度');
 else if(/requests? per minute|rpm/.test(low))parts.push('可能是 RPM / 每分鐘請求數');
 else if(/requests? per day|rpd|daily|per day/.test(low))parts.push('可能是 RPD / 每日請求數');
 else if(/quota|resource_exhausted/.test(low))parts.push('可能是配額或專案層級限制');
 if(h['retry-after'])parts.push('建議 '+h['retry-after']+' 秒後重試');
 if(h['x-ratelimit-remaining-requests']!==undefined)parts.push('剩餘請求 '+h['x-ratelimit-remaining-requests']);
 if(h['x-ratelimit-remaining-tokens']!==undefined)parts.push('剩餘 Token '+h['x-ratelimit-remaining-tokens']);
 if(h['x-ratelimit-reset-requests'])parts.push('請求重置 '+h['x-ratelimit-reset-requests']);
 if(h['x-ratelimit-reset-tokens'])parts.push('Token 重置 '+h['x-ratelimit-reset-tokens']);
 parts.push('上游訊息：'+msg);
 return parts.join('｜');
}
async function apiPost(payload,timeoutMs=30000){
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
 try{
   const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),signal:ctrl.signal});
   const d=await r.json().catch(()=>({}));
   if(!r.ok||d.error){
     const status=Number(d.status||r.status||0);
     const e=new Error(status===429?diagnoseRateLimit(d,status):(d.error||('HTTP '+r.status)));
     e.status=status;
     e.diagnostic=d.diagnostic||null;
     throw e;
   }
   return d;
 }catch(e){
   if(e?.name==='AbortError'){
     const x=new Error('等待超過 '+Math.round(timeoutMs/1000)+' 秒，已跳過');
     x.status=408;
     throw x;
   }
   throw e;
 }finally{
   clearTimeout(timer);
 }
}
function providerCooldownMs(p){
 return Math.max(0,Number(state.cooldowns[p.id]||0)-Date.now());
}
function estimateTokens(text,maxOut=0){
 const s=String(text||'');
 const cjk=(s.match(/[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/g)||[]).length;
 const other=Math.max(0,s.length-cjk);
 return Math.ceil(cjk/1.7+other/4)+Number(maxOut||0);
}
function fitPrompt(prompt,retryMode,maxOut,p){
 const cap=p?.id==='mistral'?(retryMode==='fast'?3200:6500):(retryMode==='fast'?5200:10000);
 const estimated=estimateTokens(prompt,0);
 if(estimated<=cap)return {text:prompt,estimated};
 const ratio=cap/estimated;
 const target=Math.max(5000,Math.floor(String(prompt).length*ratio));
 const head=Math.floor(target*.68),tail=Math.max(1000,target-head-20);
 const text=String(prompt).slice(0,head)+'\n\n…[系統為避免 TPM 限流已壓縮中段內容]…\n\n'+String(prompt).slice(-tail);
 return {text,estimated:estimateTokens(text,0),compressed:true};
}
function parseLimitNumber(v){
 const n=Number(String(v??'').replace(/[^0-9.]/g,''));
 return Number.isFinite(n)&&n>0?n:null;
}
function cleanupWindow(g){
 const cutoff=Date.now()-60000;
 g.req=g.req.filter(t=>t>cutoff);
 g.tok=g.tok.filter(x=>x.t>cutoff);
}
function learnLimits(p,rate){
 if(!rate)return;
 const g=gov(p);
 const reqLimit=parseLimitNumber(rate['x-ratelimit-limit-requests']);
 const tokLimit=parseLimitNumber(rate['x-ratelimit-limit-tokens']);
 const reqReset=parseDurationMs(rate['x-ratelimit-reset-requests']);
 const tokReset=parseDurationMs(rate['x-ratelimit-reset-tokens']);
 // Only treat a published limit as a per-minute budget when its reset window looks minute-scale.
 if(reqLimit && reqReset!=null && reqReset<=90000)g.rpm=reqLimit;
 if(tokLimit && tokReset!=null && tokReset<=90000)g.tpm=tokLimit;
}
function recordAttempt(p,estimatedTokens){
 const g=gov(p),now=Date.now();
 cleanupWindow(g);
 g.req.push(now);g.tok.push({t:now,n:estimatedTokens});g.lastAt=now;
}
function localBudgetWait(p,estimatedTokens){
 const g=gov(p);cleanupWindow(g);
 let wait=0,reason='';
 if(g.rpm){
   const soft=Math.max(1,Math.floor(g.rpm*.88));
   if(g.req.length>=soft){
     wait=Math.max(wait,(g.req[0]+60000)-Date.now());
     reason='RPM';
   }
 }
 if(g.tpm){
   const soft=Math.max(1,Math.floor(g.tpm*.85));
   let used=g.tok.reduce((a,x)=>a+x.n,0);
   if(used+estimatedTokens>soft && g.tok.length){
     let remaining=used+estimatedTokens;
     for(const x of g.tok){
       remaining-=x.n;
       if(remaining<=soft){
         wait=Math.max(wait,(x.t+60000)-Date.now());
         reason=reason?reason+'+TPM':'TPM';
         break;
       }
     }
   }
 }
 const gap=Math.max(0,(g.lastAt+g.minGap)-Date.now());
 if(gap>wait){wait=gap;reason=reason||'Burst guard'}
 return {wait:Math.max(0,wait),reason};
}
function classifyError(e){
 const msg=String(e?.message||'');
 const low=msg.toLowerCase();
 const status=Number(e?.status||0);
 if(/credit_balance_exhausted|no credits remaining|insufficient_quota|payment required|billing/.test(low)){
   return {kind:'billing',retry:false,label:'API 額度不足 / Billing'};
 }
 if(status===401||status===403||/invalid api key|unauthorized|forbidden/.test(low)){
   return {kind:'auth',retry:false,label:'API Key / 權限問題'};
 }
 if(status===429||/rate limit|too many requests|resource_exhausted/.test(low)){
   return {kind:'rate',retry:true,label:'Rate limit'};
 }
 if([500,502,503,504].includes(status)||/high demand|temporar|unavailable|overloaded|service unavailable/.test(low)){
   return {kind:'capacity',retry:true,label:'服務壅塞 / High demand'};
 }
 return {kind:'other',retry:false,label:'其他錯誤'};
}
function noteSuccess(p,rate){
 const g=gov(p);g.failures=0;g.circuitUntil=0;g.halfOpen=false;
 learnLimits(p,rate);
 if(!rate)return;
 const req=Number(rate['x-ratelimit-remaining-requests']);
 const tok=Number(rate['x-ratelimit-remaining-tokens']);
 let ms=0;
 if(Number.isFinite(req)&&req<=0)ms=Math.max(ms,parseDurationMs(rate['x-ratelimit-reset-requests'])||0);
 if(Number.isFinite(tok)&&tok<=0)ms=Math.max(ms,parseDurationMs(rate['x-ratelimit-reset-tokens'])||0);
 if(ms>0)state.cooldowns[p.id]=Math.max(Number(state.cooldowns[p.id]||0),Date.now()+ms);
}
function openCircuit(p,waitMs){
 const g=gov(p);g.failures++;
 if(g.failures>=2){
   const base=Math.min(120000,15000*Math.pow(2,Math.min(2,g.failures-2)));
   g.circuitUntil=Date.now()+Math.max(waitMs||0,base);
   g.halfOpen=false;
   renderParticipants();
 }
}
async function preflight(p,prompt,max,retryMode){
 if(state.blocked[p.id]){
   const e=new Error(p.name+' 本次工作階段已停用：'+state.blocked[p.id]);e.status=402;throw e;
 }
 const g=gov(p),now=Date.now();
 if(g.circuitUntil>now){
   const remain=g.circuitUntil-now;
   const e=new Error(p.name+' 熔斷器開啟，約 '+Math.ceil(remain/1000)+' 秒後半開測試；本輪先跳過');e.status=429;e.retryAfterMs=remain;throw e;
 }
 if(g.circuitUntil && g.circuitUntil<=now){g.halfOpen=true;g.circuitUntil=0;}
 const cd=providerCooldownMs(p);
 if(cd>0){
   const maxWait=retryMode==='fast'?6500:18000;
   if(cd>maxWait){const e=new Error(p.name+' cooldown 尚有 '+Math.ceil(cd/1000)+' 秒；本輪先跳過');e.status=429;e.retryAfterMs=cd;throw e;}
   setProgress(p.name+' cooldown '+Math.ceil(cd/1000)+' 秒…');await sleep(cd);
 }
 const fitted=fitPrompt(prompt,retryMode,max,p);
 const estimated=estimateTokens(fitted.text,max);
 const budget=localBudgetWait(p,estimated);
 if(budget.wait>0){
   const maxWait=retryMode==='fast'?4500:15000;
   if(budget.wait>maxWait){
     const e=new Error(p.name+' 主動節流：預估將碰到 '+budget.reason+'，約 '+Math.ceil(budget.wait/1000)+' 秒後再試；本輪先跳過');e.status=429;e.retryAfterMs=budget.wait;throw e;
   }
   setProgress(p.name+' 主動節流 '+budget.reason+'，等待 '+Math.ceil(budget.wait/1000)+' 秒…');
   await sleep(budget.wait);
 }
 return {prompt:fitted.text,estimated,compressed:!!fitted.compressed};
}
async function call(p,prompt,max=3000,retryMode='normal'){
 const maxAttempts=retryMode==='fast'?2:3;
 let lastErr=null;
 for(let attempt=0;attempt<maxAttempts;attempt++){
   const prep=await preflight(p,prompt,max,retryMode);
   try{
     recordAttempt(p,prep.estimated);
     const timeoutMs=p.id==='gemini'?(retryMode==='fast'?28000:42000):(retryMode==='fast'?20000:35000);
     const d=await apiPost({provider:p.id,model:p.model,key:p.key,prompt:prep.prompt,max},timeoutMs);
     noteSuccess(p,d.rate_limit);
     const out=String(d.text||'').trim();
     if(!out)throw new Error(p.name+' 沒有回傳文字');
     return out;
   }catch(e){
     lastErr=e;
     const cls=classifyError(e);
     if(cls.kind==='billing'||cls.kind==='auth'){
       state.blocked[p.id]=cls.label;
       renderParticipants();
       const x=new Error(p.name+'：'+cls.label+'。本工作階段不再呼叫它。｜'+String(e.message||e));x.status=e.status||402;throw x;
     }
     if(!cls.retry)throw e;
     const serverMs=Number(e.retryAfterMs)||serverRetryMs(e.diagnostic);
     const expMs=(cls.kind==='capacity'?1200:1500)*Math.pow(2,attempt);
     const jitter=Math.floor(Math.random()*700);
     const waitMs=Math.max(serverMs||0,expMs+jitter);
     state.cooldowns[p.id]=Date.now()+waitMs;
     openCircuit(p,waitMs);
     const g=gov(p);
     if(g.circuitUntil>Date.now()){
       const remain=g.circuitUntil-Date.now();
       const x=new Error(p.name+' 連續 '+cls.label+'，已啟動熔斷器 '+Math.ceil(remain/1000)+' 秒；本輪先跳過');x.status=429;x.retryAfterMs=remain;throw x;
     }
     const maxWait=retryMode==='fast'?6500:18000;
     if(attempt===maxAttempts-1||waitMs>maxWait){
       const x=new Error(String(e.message||cls.label)+'｜'+p.name+' cooldown '+Math.ceil(waitMs/1000)+' 秒；本輪先跳過');x.status=e.status||429;x.retryAfterMs=waitMs;x.diagnostic=e.diagnostic||null;throw x;
     }
     setProgress(p.name+' '+cls.label+'，'+(serverMs?'依 Retry-After':'指數退避')+'等待 '+Math.ceil(waitMs/1000)+' 秒後重試…');
     await sleep(waitMs);
     state.cooldowns[p.id]=0;
   }
 }
 throw lastErr||new Error(p.name+' 呼叫失敗');
}
async function test(p,b){
 if(!p.key){
   p.ok=false;p.testMsg='缺少 API Key';
   renderSettings();renderParticipants();return {ok:false,msg:p.testMsg};
 }
 b.disabled=true;b.textContent='測試中…';
 try{
   await apiPost({action:'test',provider:p.id,key:p.key});
   p.ok=true;p.testMsg='✓ API Key 有效';
   const g=gov(p);g.failures=0;g.circuitUntil=0;g.halfOpen=false;state.cooldowns[p.id]=0;
   renderSettings();renderParticipants();
   return {ok:true,msg:p.testMsg};
 }catch(e){
   p.ok=false;p.testMsg='✕ '+String(e.message||e);
   renderSettings();renderParticipants();
   return {ok:false,msg:p.testMsg};
 }
}
function add(who,kind,text,isFinal=false){
 $('empty').hidden=true;
 const e=document.createElement('div');e.className='msg '+(isFinal?'final':'');
 e.innerHTML='<div><b>'+esc(who)+'</b><br><small>'+esc(kind)+'</small></div><div class="bubble"></div>';
 e.querySelector('.bubble').textContent=text;$('msgs').appendChild(e);
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function roundMarker(n,total){
 const e=document.createElement('div');e.className='roundhead';e.innerHTML='<span class="roundtitle">第 '+n+' / '+total+' 輪</span><small>所有參與 AI 各發言一次</small>';$('msgs').appendChild(e);
}
function error(t){const e=document.createElement('div');e.className='err';e.textContent=t;$('msgs').appendChild(e)}
function warn(t){const e=document.createElement('div');e.className='warn';e.textContent=t;$('msgs').appendChild(e)}
function setProgress(t){$('progress').textContent=t;$('progress').classList.toggle('hide',!t)}
function priorHistory(){return state.history.slice(-6).map(x=>(x.role==='u'?'User':'Final')+': '+cut(x.text,5000)).join('\n\n')||'(none)'}
function discussionText(items,max=32000){
 const parts=[];let used=0;
 for(let i=items.length-1;i>=0;i--){
   const s='['+items[i].round+'｜'+items[i].name+']\n'+cut(items[i].text,4200);
   if(parts.length && used+s.length>max)break;
   parts.unshift(s);used+=s.length;
 }
 return parts.join('\n\n');
}
function compactText(s,limit=1000){
 s=String(s||'').replace(/\n{3,}/g,'\n\n').trim();
 if(s.length<=limit)return s;
 const head=Math.floor(limit*.72),tail=limit-head-12;
 return s.slice(0,head)+'\n…[壓縮]…\n'+s.slice(-tail);
}
function compactDiscussion(items,max=10000,perItem=1000){
 if(!items.length)return '(none)';
 const lastRound=Math.max(...items.map(x=>x.round||0));
 const keep=items.filter(x=>(x.round||0)>=Math.max(1,lastRound-1));
 const parts=[];let used=0;
 for(const x of keep){
   const s='['+x.round+'｜'+x.name+']\n'+compactText(x.text,perItem);
   if(parts.length&&used+s.length>max)break;
   parts.push(s);used+=s.length;
 }
 return parts.join('\n\n');
}
function savePrefs(includeKeys=true){
 const data={providers:P.map(p=>({id:p.id,on:p.on,model:p.model,key:includeKeys&&$('remember').checked?p.key:''})),pace:$('pace').value,rounds:$('rounds').value,final:$('final').value,remember:$('remember').checked};
 localStorage.setItem('multi-ai-roundtable-v2',JSON.stringify(data));
}
function load(){
 try{
   let d=JSON.parse(localStorage.getItem('multi-ai-roundtable-v2')||'null');
   if(!d){
     const old=JSON.parse(localStorage.getItem('multi-ai-simple')||'null');
     if(old?.p)d={providers:old.p.map(x=>({id:x.id,key:x.key||'',model:x.model,on:x.id!=='openai'})),rounds:'2',remember:true};
   }
   if(d?.providers){
     d.providers.forEach(x=>{const p=find(x.id);if(p){p.on=typeof x.on==='boolean'?x.on:p.on;p.model=x.model||p.model;p.key=x.key||''}});
     if(selected().length<2){P[0].on=true;P[1].on=true}
     $('remember').checked=!!d.remember;
     $('pace').value=d.pace||'fast';
     if(d.rounds)$('rounds').value=d.rounds;
     setTimeout(()=>{if(d.final&&selected().some(p=>p.id===d.final))$('final').value=d.final},0);
   }
 }catch{}
}
async function run(){
 if(state.running)return;
 const q=$('q').value.trim();if(!q)return;
 const ps=selected(); if(ps.length<2)return error('至少要勾選 2 個 AI。');
 const missing=ps.filter(p=>!p.key);
 if(missing.length){$('settings').classList.remove('hide');return error('請先填入已勾選 AI 的 API Key：'+missing.map(p=>p.name).join('、'))}
 const total=Number($('rounds').value)||1;
 const pace=$('pace').value;
 const fast=pace==='fast';
 const preferredFinal=find($('final').value)||ps[0];
 state.running=true;$('go').disabled=true;add('你','Request',q);
 const transcript=[],H=priorHistory();
 try{
   for(let r=1;r<=total;r++){
     roundMarker(r,total);
     let spokeThisRound=0;

     if(fast){
       const previousRounds=compactDiscussion(transcript,9000,900);
       let finished=0;
       setProgress('第 '+r+' / '+total+' 輪 · '+ps.length+' 個 AI 同時發言中…');
       await Promise.all(ps.map(async (p,i)=>{
         const roleText=r===1
           ? '提出你自己的完整看法。你與其他 AI 此刻是同時作答，不需要等待其他人。'
           : '閱讀前面已完成輪次的所有觀點，回應分歧、修正錯誤並提出新的補充。不要只是重複上一輪。';
         const prompt='Previous conversation history:\n'+H+'\n\nOriginal user request:\n'+q+'\n\nCompleted previous rounds:\n'+(previousRounds||'(none)')+'\n\nYou are '+p.name+' speaking in round '+r+' of '+total+'. '+roleText+'\n\nBe concise but substantive. Respond directly in the user\'s language.';
         try{
           const fastMax=p.id==='mistral'?600:950;
           const text=await call(p,prompt,fastMax,'fast');
           transcript.push({round:r,name:p.name,id:p.id,text});
           add(p.name,'第 '+r+' 輪 · 並行',text);
           spokeThisRound++;
         }catch(e){
           warn(p.name+' 本輪暫時跳過：'+String(e.message||e));
         }finally{
           finished++;
           setProgress('第 '+r+' / '+total+' 輪 · 已完成 '+finished+' / '+ps.length);
         }
       }));
     }else{
       for(let i=0;i<ps.length;i++){
         const p=ps[i];
         setProgress('第 '+r+' / '+total+' 輪 · '+p.name+' 正在發言…');
         const previous=compactDiscussion(transcript,14000,1200);
         const roleText=r===1
           ? (i===0?'先提出你對問題的完整看法。':'閱讀前面同輪發言後，提出自己的看法；可同意、反駁、補充，但不要只是重複。')
           : '這是後續討論輪。檢查前面所有人的觀點與修正，指出仍存在的問題、回應其他 AI，並把答案往更可靠完整的方向推進。不要只是重複上一輪。';
         const prompt='Previous conversation history:\n'+H+'\n\nOriginal user request:\n'+q+'\n\nCurrent multi-AI discussion:\n'+(previous||'(no one has spoken yet)')+'\n\nYou are '+p.name+' speaking in round '+r+' of '+total+'. '+roleText+'\n\nRespond directly in the user\'s language.';
         try{
           const text=await call(p,prompt,2400,'normal');
           transcript.push({round:r,name:p.name,id:p.id,text});
           add(p.name,'第 '+r+' 輪 · '+(i+1)+'/'+ps.length,text);
           spokeThisRound++;
         }catch(e){
           warn(p.name+' 本輪暫時跳過：'+String(e.message||e));
         }
       }
     }

     if(spokeThisRound===0){
       throw new Error('本輪所有 AI 都無法回覆。可能是免費 API 額度或速率限制，請稍後再試。');
     }
   }

   if(!transcript.length) throw new Error('目前沒有任何 AI 成功回覆。');

   const successfulIds=[...new Set(transcript.map(x=>x.id))];
   const fallbackOrder=[preferredFinal.id,...successfulIds.filter(id=>id!==preferredFinal.id)];
   let F='',usedFinal=null;
   const finalPrompt='Original user request:\n'+q+'\n\nMulti-AI discussion:\n'+(fast?compactDiscussion(transcript,18000,1500):compactDiscussion(transcript,26000,2200))+'\n\nYou are the final editor. Synthesize the strongest answer for the user. Resolve disagreements when the discussion provides enough evidence; if a real uncertainty remains, state it clearly. Remove repetition and preserve concrete corrections. Respond in the user\'s language.';

   for(const id of fallbackOrder){
     const candidate=find(id);
     if(!candidate)continue;
     setProgress('討論完成 · '+candidate.name+' 正在整理 Final…');
     try{
       const finalMax=candidate.id==='mistral'?(fast?1000:2200):(fast?1600:3200);
       F=await call(candidate,finalPrompt,finalMax,fast?'fast':'normal');
       usedFinal=candidate;
       break;
     }catch(e){
       warn(candidate.name+' 無法完成 Final，改由其他已成功發言的 AI 接手。');
     }
   }

   if(F){
     add('Final','由 '+usedFinal.name+' 整理',F,true);
   }else{
     const latest=transcript[transcript.length-1];
     F=latest.text;
     warn('所有 Final 整理嘗試都失敗，先保留最後一個成功回答。');
     add('Final','暫用 '+latest.name+' 最後成功回答',F,true);
   }

   state.history.push({role:'u',text:q},{role:'a',text:F});state.history=state.history.slice(-6);
   $('q').value='';savePrefs(true);
 }catch(e){
   error('執行停止：'+String(e.message||e));
 }finally{
   state.running=false;$('go').disabled=false;setProgress('');
 }
}
$('toggle').onclick=()=>{$('settings').classList.toggle('hide');renderSettings()};
$('save').onclick=()=>{savePrefs(true);$('settings').classList.add('hide');renderParticipants()};
$('testSelected').onclick=async()=>{
 const btn=$('testSelected');btn.disabled=true;btn.textContent='測試中…';
 const results=[];
 for(const p of selected()){
   const b=document.querySelector('[data-test="'+p.id+'"]');
   results.push({p,r:await test(p,b||btn)});
 }
 const bad=results.filter(x=>!x.r.ok);
 const box=$('testSummary');
 box.classList.remove('hide','bad');
 if(bad.length){
   box.classList.add('bad');
   box.textContent='測試完成：'+bad.length+' 個失敗。請直接看各 AI 欄位下方的紅色錯誤原因。';
 }else{
   box.textContent='✓ 測試完成：所有已勾選 API Key 都有效。';
 }
 btn.disabled=false;btn.textContent='測試已勾選 AI';
};
$('resetHealth').onclick=()=>{state.cooldowns={};state.blocked={};state.governor={};P.forEach(p=>{p.testMsg='';});renderSettings();renderParticipants();const box=$('testSummary');box.classList.add('hide');};
$('pace').onchange=()=>savePrefs(false);
$('rounds').onchange=()=>savePrefs(false);
$('final').onchange=()=>savePrefs(false);
$('go').onclick=run;
$('q').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()};
$('clear').onclick=()=>{state.history=[];$('msgs').innerHTML='';$('empty').hidden=false;setProgress('')};

load();renderParticipants();renderSettings();setInterval(()=>{if(!state.running)renderParticipants()},1000);
if(!localStorage.getItem('multi-ai-roundtable-v2')&&!localStorage.getItem('multi-ai-simple'))$('settings').classList.remove('hide');
</script></body></html>
